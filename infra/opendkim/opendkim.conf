# Sign-only milter for Postfix. Keys come from the Mailvender worker, which
# writes KeyTable, SigningTable and keys/*.private to the shared, private
# /var/lib/mailvender-dkim volume (decrypted from the database).
Syslog                  no
LogWhy                  yes
Mode                    s
Socket                  inet:8891@0.0.0.0
PidFile                 /run/opendkim/opendkim.pid
Canonicalization        relaxed/relaxed
SignatureAlgorithm      rsa-sha256
OversignHeaders         From
KeyTable                file:/var/lib/mailvender-dkim/KeyTable
SigningTable            refile:/var/lib/mailvender-dkim/SigningTable
InternalHosts           refile:/etc/opendkim/TrustedHosts
ExternalIgnoreList      refile:/etc/opendkim/TrustedHosts
# Key files are written by another container's user; the volume is private to these two services.
RequireSafeKeys         false
