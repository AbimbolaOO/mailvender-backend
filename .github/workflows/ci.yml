name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly, so new advisories (audit job) show up even without changes

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mailvender
          POSTGRES_PASSWORD: mailvender
          POSTGRES_DB: mailvender_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mailvender" --health-interval 2s --health-timeout 3s --health-retries 30
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://mailvender:mailvender@localhost:5432/mailvender_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --python 3.12
      # Migrations, account isolation, auth, sending authorization and the rest.
      - run: uv run pytest
      # The published contract must match the code.
      - run: uv run python -m app.cli openapi > /tmp/openapi.json && diff -q openapi.json /tmp/openapi.json
      - run: uv run python -m app.cli openapi --admin > /tmp/openapi-admin.json && diff -q openapi-admin.json /tmp/openapi-admin.json

  audit:
    # Known vulnerabilities in the Python packages the API and worker run.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - run: uv export --frozen --no-dev --format requirements-txt > /tmp/requirements.txt
      # Known exceptions: cryptography is pinned below 47 (newer wheels crash on the developer's Docker VM,
      # see CLAUDE.md). These advisories cover X.509 chain verification, PKCS#7 decryption and the OpenSSL
      # bundled in the wheel – we use cryptography only for Fernet and DKIM keys. Remove them with the pin.
      - run: >-
          uvx pip-audit --requirement /tmp/requirements.txt --disable-pip
          --ignore-vuln PYSEC-2026-3552 --ignore-vuln PYSEC-2026-3553 --ignore-vuln PYSEC-2026-3554
          --ignore-vuln GHSA-537c-gmf6-5ccf

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The web service mounts ../mailvender, which isn't needed to build these images.
      - run: docker compose build api postfix opendkim
